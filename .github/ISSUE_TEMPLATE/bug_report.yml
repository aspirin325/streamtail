name: Bug report
description: Report a reproducible problem with streamtail.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps or commands that reproduce the issue.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: streamtail version
      placeholder: "streamtail 0.1.0"
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15, Oracle Linux 8, Red Hat UBI 8"
