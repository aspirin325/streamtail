name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: registry.access.redhat.com/ubi8/ubi:latest
            asset_suffix: x86_64-redhat-ubi8-linux-gnu
            package_type: rpm
          - image: oraclelinux:8
            asset_suffix: x86_64-oraclelinux8-linux-gnu
            package_type: rpm
          - image: debian:12
            asset_suffix: x86_64-debian12-linux-gnu
            package_type: deb
          - image: ubuntu:24.04
            asset_suffix: x86_64-ubuntu2404-linux-gnu
            package_type: deb

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use SemVer format vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi

      - name: Install system packages
        shell: bash
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf -y install binutils ca-certificates curl gcc git gzip tar
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y binutils ca-certificates curl gcc git gzip tar
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Build release binary
        run: cargo build --locked --release --bin streamtail

      - name: Strip release binary
        run: strip -s target/release/streamtail

      - name: Install package builder
        shell: bash
        run: |
          case "${{ matrix.package_type }}" in
            rpm)
              cargo install --locked cargo-generate-rpm
              ;;
            deb)
              cargo install --locked cargo-deb
              ;;
          esac

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz" streamtail
          case "${{ matrix.package_type }}" in
            rpm)
              cargo generate-rpm --output "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.rpm"
              ;;
            deb)
              cargo deb --no-build --no-strip --output "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.deb"
              ;;
          esac

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/streamtail-${{ github.ref_name }}-${{ matrix.asset_suffix }}.spdx.json
          upload-artifact: false

      - name: Generate checksums
        shell: bash
        run: |
          (
            cd dist
            shopt -s nullglob
            for artifact in *.tar.gz *.rpm *.deb *.spdx.json; do
              sha256sum "${artifact}" > "${artifact}.sha256"
            done
          )

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
          sbom-path: dist/streamtail-${{ github.ref_name }}-${{ matrix.asset_suffix }}.spdx.json

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: streamtail-${{ matrix.asset_suffix }}
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-linux
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
