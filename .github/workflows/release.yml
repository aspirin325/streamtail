name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: registry.access.redhat.com/ubi8/ubi:latest
            asset_suffix: x86_64-redhat-ubi8-linux-gnu
            package_type: rpm
          - image: oraclelinux:8
            asset_suffix: x86_64-oraclelinux8-linux-gnu
            package_type: rpm
          - image: debian:12
            asset_suffix: x86_64-debian12-linux-gnu
            package_type: deb
          - image: ubuntu:24.04
            asset_suffix: x86_64-ubuntu2404-linux-gnu
            package_type: deb

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use SemVer format vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi

      - name: Install system packages
        shell: bash
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf -y install binutils ca-certificates curl gcc git gzip tar
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y binutils ca-certificates curl gcc git gzip tar
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Cargo version
        shell: bash
        run: |
          package_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "${package_version}" ]]; then
            echo "Could not read package version from Cargo.toml."
            exit 1
          fi

          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${package_version}."
            echo "Update Cargo.toml to version = \"${tag_version}\" before creating the release tag."
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Build release binary
        run: cargo build --locked --release --bin streamtail

      - name: Strip release binary
        run: strip -s target/release/streamtail

      - name: Install package builder
        shell: bash
        run: |
          case "${{ matrix.package_type }}" in
            rpm)
              cargo install --locked cargo-generate-rpm
              ;;
            deb)
              cargo install --locked cargo-deb
              ;;
          esac

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz" streamtail
          case "${{ matrix.package_type }}" in
            rpm)
              cargo generate-rpm --output "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.rpm"
              ;;
            deb)
              cargo deb --no-build --no-strip --output "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.deb"
              ;;
          esac

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/streamtail-${{ github.ref_name }}-${{ matrix.asset_suffix }}.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        id: attest_provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb

      - name: Attest SBOM
        id: attest_sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
          sbom-path: dist/streamtail-${{ github.ref_name }}-${{ matrix.asset_suffix }}.spdx.json

      - name: Publish attestation bundles
        shell: bash
        run: |
          cp '${{ steps.attest_provenance.outputs.bundle-path }}' \
            "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.provenance.sigstore.json"
          cp '${{ steps.attest_sbom.outputs.bundle-path }}' \
            "dist/streamtail-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.sbom.sigstore.json"

      - name: Generate checksums
        shell: bash
        run: |
          (
            cd dist
            shopt -s nullglob
            for artifact in *.tar.gz *.rpm *.deb *.spdx.json *.sigstore.json; do
              sha256sum "${artifact}" > "${artifact}.sha256"
            done
          )

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: streamtail-${{ matrix.asset_suffix }}
          path: dist/*

  build-windows:
    name: Build x86_64-windows-msvc
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Release tags must use SemVer format vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Cargo version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if ($null -eq $match) {
            Write-Error "Could not read package version from Cargo.toml."
            exit 1
          }

          $packageVersion = $match.Matches[0].Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''

          if ($packageVersion -ne $tagVersion) {
            Write-Error "Release tag $env:GITHUB_REF_NAME does not match Cargo.toml version $packageVersion. Update Cargo.toml to version = `"$tagVersion`" before creating the release tag."
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build release binary
        run: cargo build --locked --release --bin streamtail

      - name: Package binary
        shell: pwsh
        run: |
          $asset = "streamtail-$env:GITHUB_REF_NAME-x86_64-windows-msvc"
          $packageDir = "package\$asset"
          New-Item -ItemType Directory -Force -Path dist, $packageDir | Out-Null
          Copy-Item target\release\streamtail.exe "$packageDir\streamtail.exe"
          Copy-Item README.md "$packageDir\README.md"
          Copy-Item LICENSE "$packageDir\LICENSE"
          Compress-Archive -Path $packageDir -DestinationPath "dist\$asset.zip" -Force

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/streamtail-${{ github.ref_name }}-x86_64-windows-msvc.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        id: attest_provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/*.zip

      - name: Attest SBOM
        id: attest_sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/*.zip
          sbom-path: dist/streamtail-${{ github.ref_name }}-x86_64-windows-msvc.spdx.json

      - name: Publish attestation bundles
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '${{ steps.attest_provenance.outputs.bundle-path }}' `
            -Destination "dist\streamtail-$env:GITHUB_REF_NAME-x86_64-windows-msvc.provenance.sigstore.json"
          Copy-Item -LiteralPath '${{ steps.attest_sbom.outputs.bundle-path }}' `
            -Destination "dist\streamtail-$env:GITHUB_REF_NAME-x86_64-windows-msvc.sbom.sigstore.json"

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object {
            $_.Name -match '\.(zip|spdx\.json|sigstore\.json)$'
          } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: streamtail-x86_64-windows-msvc
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
